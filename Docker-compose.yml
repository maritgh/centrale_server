# Start de ontwikkelbroker met: docker compose -f Docker-compose.yml up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Alleen lokaal bereikbaar, tenzij MQTT_BIND_ADDRESS in .env een LAN-IP bevat.
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    # Configuratie is alleen-lezen; brokerdata blijft in een Docker-volume bewaard.
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

volumes:
  mosquitto_data:
