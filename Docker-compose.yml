services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - C:/mosquitto/config:/mosquitto/config
      - C:/mosquitto/data:/mosquitto/data
      - C:/mosquitto/log:/mosquitto/log
    networks:
      - mqtt_network

networks:
  mqtt_network:
    driver: bridge