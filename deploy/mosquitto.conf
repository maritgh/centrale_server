# Ontwikkelbroker; Docker bepaalt via MQTT_BIND_ADDRESS op welk hostadres de poort bereikbaar is.
listener 1883
# Zonder brokeraccount toegankelijk: gebruik dit alleen op een vertrouwd ontwikkelnetwerk.
allow_anonymous true
# Bewaar brokerstatus in het gekoppelde Docker-volume.
persistence true
persistence_location /mosquitto/data/
# Toon logs via docker compose logs en begrens de grootte van inkomende berichten.
log_dest stdout
message_size_limit 1024
