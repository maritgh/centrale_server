<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Station Network</title>

    <!-- Leaflet levert de stijlen en scripts voor de interactieve weerkaart. -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<!-- De navigatie is op alle pagina’s gelijk. -->
<header>
    <div>
        <h1>Home Station Network</h1>
        <p>Live weergegevens van onze Home Stations</p>
    </div>

    <nav>
        <a href="/">Weerkaart</a>
        <a href="/register.html">Station aanmelden</a>
        <a href="/connect.html">Hoe verstuur ik data?</a>
    </nav>
</header>

<main>
    <section class="intro">
        <h2>Weerkaart</h2>
        <p>
            Bekijk de actuele temperatuur, luchtvochtigheid en
            windsnelheid van alle Home Stations.
        </p>
    </section>

    <!-- map.js vult de status en de kaart na het ophalen van de stations. -->
    <p id="mapStatus" role="status">Stations laden…</p>
    <div id="map"></div>

</main>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<!-- Laad de eigen kaartcode nadat zowel de HTML als Leaflet beschikbaar is. -->
<script src="/js/map.js"></script>

</body>
</html>
